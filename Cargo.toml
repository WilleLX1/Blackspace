[workspace]
resolver = "2"
members = [
  "crates/blackspace-capabilities",
  "crates/blackspace-core",
  "crates/blackspace-protocol",
  "crates/blackspace-tor",
  "services/mailbox",
  "apps/desktop-windows/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bip39 = "2.2"
ciborium = "0.2"
ed25519-dalek = "2.2"
getrandom = "0.3"
hex = "0.4"
openmls = { version = "=0.8.1", features = ["js", "openmls_rust_crypto"] }
openmls_basic_credential = { version = "=0.5.0", features = ["clonable"] }
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2.0"
tls_codec = "0.4.2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "time", "process", "fs", "io-util", "net", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
urlencoding = "2.1"
utoipa = { version = "5", features = ["uuid", "time"] }
uuid = { version = "1.0", features = ["v4", "v7", "serde", "js"] }
zeroize = { version = "1.8", features = ["derive"] }
wasm-bindgen = "0.2.126"
