[package]
name = "blackspace-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "blackspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
blackspace-capabilities = { path = "../../../crates/blackspace-capabilities" }
blackspace-core = { path = "../../../crates/blackspace-core" }
blackspace-protocol = { path = "../../../crates/blackspace-protocol" }
blackspace-tor = { path = "../../../crates/blackspace-tor" }
rand.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = [] }
tauri-plugin-shell = "2.3"
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
